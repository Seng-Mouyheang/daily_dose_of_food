name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so the build works without real secrets
      DATABASE_URL: postgres://user:password@localhost:5432/placeholder
      CLOUDINARY_CLOUD_NAME: placeholder
      CLOUDINARY_API_KEY: placeholder
      CLOUDINARY_API_SECRET: placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_placeholder
      # Real Clerk test-mode keys (pk_test_/sk_test_), set via `gh secret set` or the repo's
      # Settings > Secrets and variables > Actions page. Needed so e2e navigation can complete
      # the Clerk dev-browser handshake — the secrets context is only available at job/step
      # level, not the workflow-level `env:` block, which is why this moved here. See
      # https://clerk.com/docs/testing/playwright/overview for the fuller approach
      # (@clerk/testing's setupClerkTestingToken skips the handshake outright).
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_E2E_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm spellcheck
      - run: pnpm check
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
